services:
    gomaster:
        build: ./gomaster
        ports:
            - "7888:7888"
            - "8888:8888"
        networks:
            - app
        restart: unless-stopped
    nginx:
        build:
            context: ./build/nginx
        ports:
            - '${APP_PORT:-80}:80'
        networks:
            - app
        volumes:
            - ./:/var/www/html
            - ./build/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
    php:
        build:
            context: ./build/php
        ports:
            - '5173:5173'
        networks:
            - app
        volumes:
            - ./:/var/www/html
            - ./build/php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini
        depends_on:
            - mysql
        extra_hosts:
            - 'host.docker.internal:host-gateway'
    cron:
        build:
            context: ./build/cron
        networks:
            - app
        volumes:
            - ./:/var/www/html
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'mysql:/var/lib/mysql'
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    grafana:
        image: 'grafana/grafana'
        ports:
            - '3000:3000'
        networks:
            - app
        environment:
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_PASSWORD}'
        volumes:
            - grafana:/var/lib/grafana
    prometheus:
        image: 'prom/prometheus'
        volumes:
            - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        networks:
            - app
networks:
    app:
        driver: bridge
volumes:
    mysql:
        driver: local
    grafana:
        driver: local
